services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: recs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # 5433 on the host, because webshow-core's database already holds 5432. Each service
    # declares its own store, so this repo runs on its own.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - recs-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  recs-postgres-data:
