[project]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "python-dotenv>=1.0",
]

name = "recommendations-service"
version = "0.1.0"
description = "Retrieval for webshow: movie vectors, similar titles, and search over them"
requires-python = ">=3.12"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
recommendations = "recommendations.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/recommendations"]
