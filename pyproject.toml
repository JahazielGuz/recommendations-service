[project]
name = "recs-service"
version = "0.1.0"
description = "Similar titles for webshow: every movie as a vector"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "openai>=1.60",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[project.scripts]
recs = "recs.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recs"]
